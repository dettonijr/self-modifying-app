<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: grid; gap: 0.5rem; margin-bottom: 1.5rem; }
    textarea { min-height: 6rem; font: inherit; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .counter { margin-left: auto; color: #666; font-variant-numeric: tabular-nums; }
    .error { color: #b00020; }
    #prompts { list-style: none; padding: 0; }
    #prompts li { border-top: 1px solid #ddd; padding: 0.5rem 0; }
    #prompts li { cursor: pointer; }
    #prompts a.open { color: inherit; text-decoration: none; }
    #prompts .details { color: #666; font-size: 0.85em; margin-top: 0.15rem; }
    #prompts .outcome.landed { color: #1b7a33; }
    #prompts .actions { margin-top: 0.25rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #prompts .confirm { background: #f4f4f4; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
    .nickname { font-weight: bold; }
    .original { color: #666; font-size: 0.85em; }
    .state { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.1em 0.4em; border-radius: 0.3em; background: #eee; }
    .state.landed { background: #d7f5dd; }
    .state.rejected { background: #fbe0e3; }
    .state.resolving, .state.restarted { background: #fdf0cf; }
    .empty { color: #666; }
    .spending { color: #666; font-variant-numeric: tabular-nums; }
    .paused { background: #fff4e5; border: 1px solid #f0b54a; padding: 0.75rem 1rem; border-radius: 0.25rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Console</h1>
  <p class="spending">Spent <span data-testid="spending" id="spending">…</span></p>
  <p class="paused" data-testid="paused" id="paused" role="alert" hidden>
    The Console is paused: the game has reached its spending cap. New Prompts are refused until the host raises it.
  </p>

  <form id="nickname-form" hidden>
    <label for="nickname">Nickname</label>
    <div class="row">
      <input id="nickname" name="nickname" maxlength="40" required autocomplete="nickname">
      <button type="submit">Join</button>
    </div>
  </form>

  <section id="player" hidden>
    <p>Playing as <strong data-testid="current-nickname" id="current-nickname"></strong>
      <button type="button" id="change-nickname">Change nickname</button></p>

    <form id="prompt-form">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" maxlength="500" required placeholder="Make the page snow"></textarea>
      <div class="row">
        <label for="model">Model</label>
        <select id="model" name="model"></select>
        <span class="counter" data-testid="prompt-counter" id="prompt-counter">0 / 500</span>
        <button type="submit">Send</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </section>

  <h2>Prompts</h2>
  <ol id="prompts" data-testid="prompts"></ol>
  <p id="prompts-empty" class="empty">No Prompts yet.</p>

  <script type="module">
    import { actionsFor, connectLive, fillModels, followSpending, isFinished, modelName, pausable, runUrl, span } from "/console-shared.js";

    const $ = (id) => document.getElementById(id);
    fillModels($("model"));
    pausable(document.querySelector("#prompt-form button[type=submit]"));
    const MAX_PROMPT = 500;

    function readNickname() {
      const entry = document.cookie.split("; ").find((c) => c.startsWith("nickname="));
      return entry ? decodeURIComponent(entry.slice("nickname=".length)) : "";
    }

    function showPlayer() {
      const nickname = readNickname();
      $("nickname-form").hidden = nickname !== "";
      $("player").hidden = nickname === "";
      $("current-nickname").textContent = nickname;
      if (nickname === "") $("nickname").focus();
    }

    $("nickname-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const nickname = $("nickname").value.trim();
      if (nickname === "") return;
      document.cookie = `nickname=${encodeURIComponent(nickname)}; path=/; max-age=${60 * 60 * 24 * 365}; samesite=strict`;
      showPlayer();
    });

    $("change-nickname").addEventListener("click", () => {
      $("nickname").value = readNickname();
      $("nickname-form").hidden = false;
      $("player").hidden = true;
      $("nickname").focus();
    });

    const updateCounter = () => ($("prompt-counter").textContent = `${$("prompt").value.length} / ${MAX_PROMPT}`);
    $("prompt").addEventListener("input", updateCounter);

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").className = isError ? "error" : "";
    }

    $("prompt-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/prompts", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prompt: $("prompt").value, model: $("model").value }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) return setStatus(body.error ?? "The Prompt was refused", true);
      $("prompt").value = "";
      updateCounter();
      myRuns.add(body.id);
      setStatus(body.state === "waiting" ? "Your Prompt is in the queue…" : "Claude is working on it…");
    });

    // Live updates: a snapshot with every Run's summary on connecting, then each Run's summary whenever it changes.
    const MAX_PROMPT_SHOWN = 80;
    const myRuns = new Set();
    // Entry elements by Run id, newest first in the list.
    const entries = new Map();

    function handleLive(message) {
      if (message.type === "snapshot") {
        entries.clear();
        for (const run of message.runs) entries.set(run.id, entry(run));
        $("prompts").replaceChildren(...entries.values());
      } else if (message.type === "run") {
        const run = message.run;
        const updated = entry(run);
        const old = entries.get(run.id);
        if (old) old.replaceWith(updated);
        else $("prompts").prepend(updated);
        entries.set(run.id, updated);
        if (myRuns.has(run.id)) showMyRun(run);
        if (isFinished(run)) void refreshSpending();
      }
      $("prompts-empty").hidden = entries.size > 0;
    }

    function showMyRun(run) {
      if (run.state === "running") setStatus("Claude is working on it…");
      if (run.state === "resolving") setStatus("Your change couldn't Land as it was; Claude is fixing it…");
      if (run.state === "restarted") setStatus("Your change couldn't be reconciled; Claude is starting over on the latest Canvas…");
      if (run.state === "landed") setStatus("Your change Landed!");
      if (run.state === "rejected") setStatus(`Your Prompt didn't Land: ${run.error}`, true);
    }

    const shorten = (text) => (text.length > MAX_PROMPT_SHOWN ? text.slice(0, MAX_PROMPT_SHOWN - 1).trimEnd() + "…" : text);

    /** One Prompts list entry: state, who, the Prompt, model, time and outcome, plus Replay and Roll back once Landed. */
    function entry(run) {
      const item = document.createElement("li");
      item.dataset.run = run.id;
      item.dataset.state = run.state;
      const who = span("nickname", run.nickname);
      const prompt = document.createElement("q");
      prompt.className = "prompt";
      prompt.textContent = shorten(run.prompt);
      prompt.title = run.prompt;
      // A real link too, for keyboards and opening in a new tab.
      const link = document.createElement("a");
      link.className = "open";
      link.href = runUrl(run.id);
      link.append(prompt);
      item.append(span(`state ${run.state}`, run.state), " ");
      if ((run.kind === "Replay" || run.kind === "Rollback") && run.original) {
        item.dataset.original = run.original.commit;
        const reference = document.createElement("code");
        reference.className = "original";
        reference.textContent = run.original.commit.slice(0, 7);
        reference.title = `${run.kind} of ${run.original.commit}`;
        const finished = isFinished(run);
        const [mark, verb] = run.kind === "Replay" ? ["↻ ", finished ? " replayed " : " replays "] : ["↩ ", finished ? " rolled back " : " rolls back "];
        item.append(mark, who, verb, span("nickname original-nickname", run.original.nickname), "'s ", link, " ", reference);
      } else {
        item.append(who, ": ", link);
      }
      const details = document.createElement("div");
      details.className = "details";
      details.append(span("model", modelName(run.model)));
      if (run.time) {
        const time = document.createElement("time");
        time.dateTime = run.time;
        time.textContent = new Date(run.time).toLocaleString();
        details.append(" · ", time);
      }
      if (run.state === "landed") details.append(" · ", span("outcome landed", "Landed"));
      if (run.state === "rejected") details.append(" · ", span("outcome error", run.error ?? "Rejected"));
      item.append(details);
      // The whole entry opens the Run's page, except its buttons and confirmations.
      item.addEventListener("click", (event) => {
        if (event.target.closest("button, select, a, .confirm")) return;
        location.href = runUrl(run.id);
      });
      if (run.state === "landed" && run.commit) item.append(actionsFor(run, { defaultModel: () => $("model").value, onQueued }));
      return item;
    }

    function onQueued({ ok, what, run, error, started }) {
      if (!ok) return setStatus(error, true);
      myRuns.add(run.id);
      setStatus(run.state === "waiting" ? `Your ${what} is in the queue…` : started);
    }

    const usd = (amount) => `$${amount.toFixed(2)}`;

    const refreshSpending = followSpending((spending) => {
      $("spending").textContent = `${usd(spending.totalUsd)} of ${usd(spending.capUsd)}`;
      $("paused").hidden = !spending.paused;
    });

    showPlayer();
    updateCounter();
    connectLive(handleLive);
  </script>
</body>
</html>
