<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: grid; gap: 0.5rem; margin-bottom: 1.5rem; }
    textarea { min-height: 6rem; font: inherit; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .counter { margin-left: auto; color: #666; font-variant-numeric: tabular-nums; }
    .error { color: #b00020; }
    #prompts { list-style: none; padding: 0; }
    #prompts li { border-top: 1px solid #ddd; padding: 0.5rem 0; }
    #prompts .details { color: #666; font-size: 0.85em; margin-top: 0.15rem; }
    #prompts .outcome.landed { color: #1b7a33; }
    #prompts .actions { margin-top: 0.25rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #prompts .confirm { background: #f4f4f4; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
    .nickname { font-weight: bold; }
    .original { color: #666; font-size: 0.85em; }
    .state { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.1em 0.4em; border-radius: 0.3em; background: #eee; }
    .state.landed { background: #d7f5dd; }
    .state.rejected { background: #fbe0e3; }
    .state.resolving, .state.restarted { background: #fdf0cf; }
    .empty { color: #666; }
    .spending { color: #666; font-variant-numeric: tabular-nums; }
    .paused { background: #fff4e5; border: 1px solid #f0b54a; padding: 0.75rem 1rem; border-radius: 0.25rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Console</h1>
  <p class="spending">Spent <span data-testid="spending" id="spending">…</span></p>
  <p class="paused" data-testid="paused" id="paused" role="alert" hidden>
    The Console is paused: the game has reached its spending cap. New Prompts are refused until the host raises it.
  </p>

  <form id="nickname-form" hidden>
    <label for="nickname">Nickname</label>
    <div class="row">
      <input id="nickname" name="nickname" maxlength="40" required autocomplete="nickname">
      <button type="submit">Join</button>
    </div>
  </form>

  <section id="player" hidden>
    <p>Playing as <strong data-testid="current-nickname" id="current-nickname"></strong>
      <button type="button" id="change-nickname">Change nickname</button></p>

    <form id="prompt-form">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" maxlength="500" required placeholder="Make the page snow"></textarea>
      <div class="row">
        <label for="model">Model</label>
        <select id="model" name="model">
          <option value="claude-sonnet-5-5" selected>Sonnet 5.5</option>
          <option value="claude-opus-5-5">Opus 5.5</option>
        </select>
        <span class="counter" data-testid="prompt-counter" id="prompt-counter">0 / 500</span>
        <button type="submit">Send</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </section>

  <h2>Prompts</h2>
  <ol id="prompts" data-testid="prompts"></ol>
  <p id="prompts-empty" class="empty">No Prompts yet.</p>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const MAX_PROMPT = 500;

    function readNickname() {
      const entry = document.cookie.split("; ").find((c) => c.startsWith("nickname="));
      return entry ? decodeURIComponent(entry.slice("nickname=".length)) : "";
    }

    function showPlayer() {
      const nickname = readNickname();
      $("nickname-form").hidden = nickname !== "";
      $("player").hidden = nickname === "";
      $("current-nickname").textContent = nickname;
      if (nickname === "") $("nickname").focus();
    }

    $("nickname-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const nickname = $("nickname").value.trim();
      if (nickname === "") return;
      document.cookie = `nickname=${encodeURIComponent(nickname)}; path=/; max-age=${60 * 60 * 24 * 365}; samesite=strict`;
      showPlayer();
    });

    $("change-nickname").addEventListener("click", () => {
      $("nickname").value = readNickname();
      $("nickname-form").hidden = false;
      $("player").hidden = true;
      $("nickname").focus();
    });

    const updateCounter = () => ($("prompt-counter").textContent = `${$("prompt").value.length} / ${MAX_PROMPT}`);
    $("prompt").addEventListener("input", updateCounter);

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").className = isError ? "error" : "";
    }

    $("prompt-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/prompts", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prompt: $("prompt").value, model: $("model").value }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) return setStatus(body.error ?? "The Prompt was refused", true);
      $("prompt").value = "";
      updateCounter();
      myRuns.add(body.id);
      setStatus(body.state === "waiting" ? "Your Prompt is in the queue…" : "Claude is working on it…");
    });

    // Live updates: a snapshot with every Run's summary on connecting, then each Run's summary whenever it changes.
    const MAX_PROMPT_SHOWN = 80;
    const MODEL_NAMES = Object.fromEntries([...$("model").options].map((option) => [option.value, option.textContent]));
    const myRuns = new Set();
    // Entry elements by Run id, newest first in the list.
    const entries = new Map();

    function connectLive() {
      const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/live`);
      socket.addEventListener("message", (event) => handleLive(JSON.parse(event.data)));
      socket.addEventListener("close", () => setTimeout(connectLive, 1000));
    }

    function handleLive(message) {
      if (message.type === "snapshot") {
        entries.clear();
        for (const run of message.runs) entries.set(run.id, entry(run));
        $("prompts").replaceChildren(...entries.values());
      } else if (message.type === "run") {
        const run = message.run;
        const updated = entry(run);
        const old = entries.get(run.id);
        if (old) old.replaceWith(updated);
        else $("prompts").prepend(updated);
        entries.set(run.id, updated);
        if (myRuns.has(run.id)) showMyRun(run);
        if (run.state === "landed" || run.state === "rejected") void refreshSpending();
      }
      $("prompts-empty").hidden = entries.size > 0;
    }

    function showMyRun(run) {
      if (run.state === "running") setStatus("Claude is working on it…");
      if (run.state === "resolving") setStatus("Your change couldn't Land as it was; Claude is fixing it…");
      if (run.state === "restarted") setStatus("Your change couldn't be reconciled; Claude is starting over on the latest Canvas…");
      if (run.state === "landed") setStatus("Your change Landed!");
      if (run.state === "rejected") setStatus(`Your Prompt didn't Land: ${run.error}`, true);
    }

    const shorten = (text) => (text.length > MAX_PROMPT_SHOWN ? text.slice(0, MAX_PROMPT_SHOWN - 1).trimEnd() + "…" : text);

    function span(className, text) {
      const element = document.createElement("span");
      element.className = className;
      element.textContent = text;
      return element;
    }

    /** One Prompts list entry: state, who, the Prompt, model, time and outcome, plus Replay and Roll back once Landed. */
    function entry(run) {
      const item = document.createElement("li");
      item.dataset.run = run.id;
      item.dataset.state = run.state;
      const who = span("nickname", run.nickname);
      const prompt = document.createElement("q");
      prompt.className = "prompt";
      prompt.textContent = shorten(run.prompt);
      prompt.title = run.prompt;
      item.append(span(`state ${run.state}`, run.state), " ");
      if ((run.kind === "Replay" || run.kind === "Rollback") && run.original) {
        item.dataset.original = run.original.commit;
        const reference = document.createElement("code");
        reference.className = "original";
        reference.textContent = run.original.commit.slice(0, 7);
        reference.title = `${run.kind} of ${run.original.commit}`;
        const finished = run.state === "landed" || run.state === "rejected";
        const [mark, verb] = run.kind === "Replay" ? ["↻ ", finished ? " replayed " : " replays "] : ["↩ ", finished ? " rolled back " : " rolls back "];
        item.append(mark, who, verb, span("nickname original-nickname", run.original.nickname), "'s ", prompt, " ", reference);
      } else {
        item.append(who, ": ", prompt);
      }
      const details = document.createElement("div");
      details.className = "details";
      details.append(span("model", MODEL_NAMES[run.model] ?? run.model));
      if (run.time) {
        const time = document.createElement("time");
        time.dateTime = run.time;
        time.textContent = new Date(run.time).toLocaleString();
        details.append(" · ", time);
      }
      if (run.state === "landed") details.append(" · ", span("outcome landed", "Landed"));
      if (run.state === "rejected") details.append(" · ", span("outcome error", run.error ?? "Rejected"));
      item.append(details);
      if (run.state === "landed" && run.commit) item.append(actionsFor(run));
      return item;
    }

    // The open confirmation, kept across updates: the Run's id, whether it's a "replay" or a "rollback", and the picked Replay model.
    let confirming;
    // Whether the spending cap pauses the Console; Send, Replay and Roll back are disabled while it does.
    let paused = false;

    function pausable(button) {
      button.dataset.pausable = "";
      button.disabled = paused;
      return button;
    }

    function button(text, onClick) {
      const element = document.createElement("button");
      element.type = "button";
      element.textContent = text;
      element.addEventListener("click", onClick);
      return element;
    }

    function actionsFor(run) {
      const actions = document.createElement("div");
      actions.className = "actions";
      const replay = pausable(button("Replay", () => {
        confirming = { id: run.id, action: "replay", model: $("model").value };
        showReplayConfirmation(run, actions);
      }));
      const rollback = pausable(button("Roll back", () => {
        confirming = { id: run.id, action: "rollback" };
        showRollbackConfirmation(run, actions);
      }));
      actions.append(replay, rollback);
      if (confirming?.id === run.id) {
        if (confirming.action === "replay") showReplayConfirmation(run, actions);
        else showRollbackConfirmation(run, actions);
      }
      return actions;
    }

    function closeConfirmation(confirm) {
      confirming = undefined;
      confirm.remove();
    }

    /** Asks before a Replay starts, and lets the Player pick its model. */
    function showReplayConfirmation(run, actions) {
      actions.querySelector(".confirm")?.remove();
      const confirm = document.createElement("span");
      confirm.className = "confirm replay";
      const question = span("", `Replay ${run.nickname}'s Prompt on the current Canvas?`);
      const model = $("model").cloneNode(true);
      model.removeAttribute("id");
      model.setAttribute("aria-label", "Replay model");
      model.value = confirming.model;
      model.addEventListener("change", () => (confirming.model = model.value));
      const go = pausable(button("Yes, replay", async () => {
        closeConfirmation(confirm);
        await queueChange("/api/replays", { commit: run.commit, model: model.value }, "Replay", "Claude is working on your Replay…");
      }));
      const cancel = button("Cancel", () => closeConfirmation(confirm));
      confirm.append(question, " ", model, " ", go, " ", cancel);
      actions.append(confirm);
    }

    /** Asks before a Rollback starts. */
    function showRollbackConfirmation(run, actions) {
      actions.querySelector(".confirm")?.remove();
      const confirm = document.createElement("span");
      confirm.className = "confirm rollback";
      const question = span("", `Roll back ${run.nickname}'s change? Everything that Landed after it is kept.`);
      const go = pausable(button("Yes, roll back", async () => {
        closeConfirmation(confirm);
        await queueChange("/api/rollbacks", { commit: run.commit }, "Rollback", "Rolling it back…");
      }));
      const cancel = button("Keep it", () => closeConfirmation(confirm));
      confirm.append(question, " ", go, " ", cancel);
      actions.append(confirm);
    }

    async function queueChange(url, body, what, started) {
      const response = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      const run = await response.json().catch(() => ({}));
      if (!response.ok) return setStatus(run.error ?? `The ${what} was refused`, true);
      myRuns.add(run.id);
      setStatus(run.state === "waiting" ? `Your ${what} is in the queue…` : started);
    }

    const usd = (amount) => `$${amount.toFixed(2)}`;

    // Polled for now; ticket 05's WebSocket can push the same /api/spending body.
    async function refreshSpending() {
      const response = await fetch("/api/spending");
      if (!response.ok) return;
      const spending = await response.json();
      paused = spending.paused;
      $("spending").textContent = `${usd(spending.totalUsd)} of ${usd(spending.capUsd)}`;
      $("paused").hidden = !paused;
      document.querySelector("#prompt-form button[type=submit]").disabled = paused;
      for (const button of document.querySelectorAll("#prompts [data-pausable]")) button.disabled = paused;
    }

    showPlayer();
    updateCounter();
    connectLive();
    void refreshSpending();
    setInterval(refreshSpending, 2000);
  </script>
</body>
</html>
