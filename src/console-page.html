<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: grid; gap: 0.5rem; margin-bottom: 1.5rem; }
    textarea { min-height: 6rem; font: inherit; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .counter { margin-left: auto; color: #666; font-variant-numeric: tabular-nums; }
    .error { color: #b00020; }
    #history, #queue, #runs { list-style: none; padding: 0; }
    #history li, #queue li, #runs li { border-top: 1px solid #ddd; padding: 0.5rem 0; }
    #history time { color: #666; font-size: 0.85em; }
    #history .actions { margin-top: 0.25rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #history .confirm { background: #f4f4f4; padding: 0.25rem 0.5rem; border-radius: 0.25rem; }
    .original { color: #666; font-size: 0.85em; }
    .state { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.1em 0.4em; border-radius: 0.3em; background: #eee; }
    .state.landed { background: #d7f5dd; }
    .state.rejected { background: #fbe0e3; }
    .state.resolving, .state.restarted { background: #fdf0cf; }
    #runs .progress li { border: 0; padding: 0; }
    .progress { color: #555; font-size: 0.9em; margin: 0.25rem 0 0; padding-left: 1rem; }
    .empty { color: #666; }
    .spending { color: #666; font-variant-numeric: tabular-nums; }
    .paused { background: #fff4e5; border: 1px solid #f0b54a; padding: 0.75rem 1rem; border-radius: 0.25rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Console</h1>
  <p class="spending">Spent <span data-testid="spending" id="spending">…</span></p>
  <p class="paused" data-testid="paused" id="paused" role="alert" hidden>
    The Console is paused: the game has reached its spending cap. New Prompts are refused until the host raises it.
  </p>

  <form id="nickname-form" hidden>
    <label for="nickname">Nickname</label>
    <div class="row">
      <input id="nickname" name="nickname" maxlength="40" required autocomplete="nickname">
      <button type="submit">Join</button>
    </div>
  </form>

  <section id="player" hidden>
    <p>Playing as <strong data-testid="current-nickname" id="current-nickname"></strong>
      <button type="button" id="change-nickname">Change nickname</button></p>

    <form id="prompt-form">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" maxlength="500" required placeholder="Make the page snow"></textarea>
      <div class="row">
        <label for="model">Model</label>
        <select id="model" name="model">
          <option value="claude-sonnet-5-5" selected>Sonnet 5.5</option>
          <option value="claude-opus-5-5">Opus 5.5</option>
        </select>
        <span class="counter" data-testid="prompt-counter" id="prompt-counter">0 / 500</span>
        <button type="submit">Send</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </section>

  <h2>Queue</h2>
  <ol id="queue" data-testid="queue"></ol>
  <p id="queue-empty" class="empty">Nothing waiting.</p>

  <h2>Runs</h2>
  <ol id="runs" data-testid="runs"></ol>

  <h2>History</h2>
  <ol id="history" data-testid="history"></ol>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const MAX_PROMPT = 500;

    function readNickname() {
      const entry = document.cookie.split("; ").find((c) => c.startsWith("nickname="));
      return entry ? decodeURIComponent(entry.slice("nickname=".length)) : "";
    }

    function showPlayer() {
      const nickname = readNickname();
      $("nickname-form").hidden = nickname !== "";
      $("player").hidden = nickname === "";
      $("current-nickname").textContent = nickname;
      if (nickname === "") $("nickname").focus();
    }

    $("nickname-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const nickname = $("nickname").value.trim();
      if (nickname === "") return;
      document.cookie = `nickname=${encodeURIComponent(nickname)}; path=/; max-age=${60 * 60 * 24 * 365}; samesite=strict`;
      showPlayer();
    });

    $("change-nickname").addEventListener("click", () => {
      $("nickname").value = readNickname();
      $("nickname-form").hidden = false;
      $("player").hidden = true;
      $("nickname").focus();
    });

    const updateCounter = () => ($("prompt-counter").textContent = `${$("prompt").value.length} / ${MAX_PROMPT}`);
    $("prompt").addEventListener("input", updateCounter);

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").className = isError ? "error" : "";
    }

    $("prompt-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/prompts", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ prompt: $("prompt").value, model: $("model").value }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) return setStatus(body.error ?? "The Prompt was refused", true);
      $("prompt").value = "";
      updateCounter();
      myRuns.add(body.id);
      setStatus(body.state === "waiting" ? "Your Prompt is in the queue…" : "Claude is working on it…");
    });

    // Live updates: a snapshot on connecting, then queue, Run and progress events.
    const MAX_RUNS_SHOWN = 20;
    const MAX_PROGRESS_SHOWN = 5;
    const myRuns = new Set();
    let queue = [];
    let runs = new Map();

    function connectLive() {
      const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/live`);
      socket.addEventListener("message", (event) => handleLive(JSON.parse(event.data)));
      socket.addEventListener("close", () => setTimeout(connectLive, 1000));
    }

    function handleLive(message) {
      if (message.type === "snapshot") {
        queue = message.queue;
        runs = new Map(message.runs.map((run) => [run.id, run]));
        void refreshHistory();
      } else if (message.type === "queue") {
        queue = message.queue;
      } else if (message.type === "run") {
        if (message.run.state !== "waiting") runs.set(message.run.id, message.run);
        if (myRuns.has(message.run.id)) showMyRun(message.run);
        if (message.run.state === "landed") void refreshHistory();
        if (message.run.state === "landed" || message.run.state === "rejected") void refreshSpending();
      } else if (message.type === "progress") {
        const run = runs.get(message.runId);
        if (run) run.progress.push({ message: message.message, file: message.file });
      }
      render();
    }

    function showMyRun(run) {
      if (run.state === "running") setStatus("Claude is working on it…");
      if (run.state === "resolving") setStatus("Your change couldn't Land as it was; Claude is fixing it…");
      if (run.state === "restarted") setStatus("Your change couldn't be reconciled; Claude is starting over on the latest Canvas…");
      if (run.state === "landed") setStatus("Your change Landed!");
      if (run.state === "rejected") setStatus(`Your Prompt didn't Land: ${run.error}`, true);
    }

    function describe(run) {
      const item = document.createElement("li");
      const who = document.createElement("strong");
      who.textContent = run.nickname;
      const prompt = document.createElement("q");
      prompt.textContent = run.prompt;
      if (run.kind === "Replay") item.append("↻ ");
      item.append(who, ": ", prompt);
      return item;
    }

    function render() {
      $("queue").replaceChildren(...queue.map(describe));
      $("queue-empty").hidden = queue.length > 0;
      const shown = [...runs.values()].reverse().slice(0, MAX_RUNS_SHOWN);
      $("runs").replaceChildren(
        ...shown.map((run) => {
          const item = describe(run);
          item.dataset.state = run.state;
          const state = document.createElement("span");
          state.className = `state ${run.state}`;
          state.textContent = run.state;
          item.prepend(state, " ");
          if (run.state === "rejected") {
            const reason = document.createElement("p");
            reason.className = "error";
            reason.textContent = run.error;
            item.append(reason);
          } else if (["running", "landing", "resolving", "restarted"].includes(run.state)) {
            const progress = document.createElement("ul");
            progress.className = "progress";
            progress.append(
              ...run.progress.slice(-MAX_PROGRESS_SHOWN).map((step) => {
                const line = document.createElement("li");
                line.textContent = step.message;
                return line;
              }),
            );
            item.append(progress);
          }
          return item;
        }),
      );
    }

    // The history entry whose "Fix it to this!" confirmation is open, kept across refreshes.
    let confirmingReplay;

    async function refreshHistory() {
      const response = await fetch("/api/history");
      if (!response.ok) return;
      const changes = await response.json();
      $("history").replaceChildren(
        ...changes.map((change) => {
          const item = document.createElement("li");
          const who = document.createElement("strong");
          who.textContent = change.nickname;
          const prompt = document.createElement("q");
          prompt.textContent = change.prompt;
          const time = document.createElement("time");
          time.dateTime = change.time;
          time.textContent = new Date(change.time).toLocaleString();
          if (change.kind === "Replay" && change.original) {
            const originalWho = document.createElement("strong");
            originalWho.textContent = change.original.nickname;
            const reference = document.createElement("code");
            reference.className = "original";
            reference.textContent = change.original.commit.slice(0, 7);
            reference.title = `Replay of ${change.original.commit}`;
            item.dataset.original = change.original.commit;
            item.append("↻ ", who, " replayed ", originalWho, "'s ", prompt, " ", reference, " ", time);
          } else {
            item.append(who, ": ", prompt, " ", time);
          }
          const actions = document.createElement("div");
          actions.className = "actions";
          const fix = document.createElement("button");
          fix.type = "button";
          fix.textContent = "Fix it to this!";
          fix.addEventListener("click", () => {
            confirmingReplay = change.commit;
            showReplayConfirmation(change, actions);
          });
          actions.append(fix);
          if (confirmingReplay === change.commit) showReplayConfirmation(change, actions);
          item.append(actions);
          return item;
        }),
      );
    }

    /** Asks before a Replay starts, and lets the Player pick its model. */
    function showReplayConfirmation(change, actions) {
      actions.querySelector(".confirm")?.remove();
      const confirm = document.createElement("span");
      confirm.className = "confirm";
      const question = document.createElement("span");
      question.textContent = `Replay ${change.nickname}'s Prompt on the current Canvas?`;
      const model = $("model").cloneNode(true);
      model.removeAttribute("id");
      model.setAttribute("aria-label", "Replay model");
      model.value = $("model").value;
      const go = document.createElement("button");
      go.type = "button";
      go.textContent = "Replay";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "Cancel";
      const close = () => {
        confirmingReplay = undefined;
        confirm.remove();
      };
      cancel.addEventListener("click", close);
      go.addEventListener("click", async () => {
        close();
        const response = await fetch("/api/replays", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ commit: change.commit, model: model.value }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) return setStatus(body.error ?? "The Replay was refused", true);
        myRuns.add(body.id);
        setStatus(body.state === "waiting" ? "Your Replay is in the queue…" : "Claude is working on your Replay…");
      });
      confirm.append(question, " ", model, " ", go, " ", cancel);
      actions.append(confirm);
    }

    const usd = (amount) => `$${amount.toFixed(2)}`;

    // Polled for now; ticket 05's WebSocket can push the same /api/spending body.
    async function refreshSpending() {
      const response = await fetch("/api/spending");
      if (!response.ok) return;
      const { totalUsd, capUsd, paused } = await response.json();
      $("spending").textContent = `${usd(totalUsd)} of ${usd(capUsd)}`;
      $("paused").hidden = !paused;
      document.querySelector("#prompt-form button[type=submit]").disabled = paused;
    }

    showPlayer();
    updateCounter();
    render();
    connectLive();
    void refreshSpending();
    setInterval(refreshSpending, 2000);
  </script>
</body>
</html>
