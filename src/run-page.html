<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run</title>
  <link rel="stylesheet" href="/palette.css">
  <link rel="stylesheet" href="/console.css">
  <style>
    nav { margin-bottom: 0.75rem; }
    nav a, #canvas-version a {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0.5rem 0.9rem;
      border-radius: 10px; border: 1px solid var(--color-border-strong); background: var(--color-surface);
      color: var(--color-text); font-weight: 600; text-decoration: none;
    }
    #canvas-version a { border-color: var(--color-accent); color: var(--color-accent); }
    #canvas-version a::after { content: " ↗"; margin-left: 0.3em; }

    #run > header { margin-bottom: 0.5rem; }
    #headline { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; font-size: 1.5rem; }
    #headline .state { font-size: 0.8rem; }
    .original { margin: 0.75rem 0 0; }
    .original a { color: var(--color-text-muted); }
    .prompt {
      white-space: pre-wrap; margin: 1rem 0; padding: 0.9rem 1rem;
      border-left: 4px solid var(--color-claude); border-radius: 0 12px 12px 0;
      background: var(--color-background-deep); font-size: 1.15rem; line-height: 1.45;
    }
    .details { margin: 0 0 1rem; color: var(--color-text-muted); font-size: 0.9rem; }

    section.card { margin-top: 1rem; }
    section.card > h2 { margin: 0 0 0.75rem; }

    .entries { list-style: none; padding: 0; margin: 0; }
    .entries li {
      display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: 0.15rem 0.6rem;
      padding: 0.55rem 0; border-top: 1px solid var(--color-border);
    }
    .entries li:first-child { border-top: none; padding-top: 0; }
    .entries time { color: var(--color-text-muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .entries .source { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2em 0.5em; border-radius: 6px; border: 1px solid currentColor; color: var(--color-text-muted); }
    .entries [data-source="claude"] .source { color: var(--color-claude); }
    .entries [data-source="tool"] .source { color: var(--color-info); }
    .entries .text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
    .entries [data-source="platform"] .text { color: var(--color-text-muted); }
    .entries [data-source="thinking"] .text { color: var(--color-text-muted); font-style: italic; }
    .entries [data-source="tool"] .text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9rem; }
    /* A thinking summary longer than one line shows its first line until tapped. */
    .entries details.text summary { cursor: pointer; list-style: none; min-height: 44px; display: flex; align-items: center; gap: 0.4rem; }
    .entries details.text summary::-webkit-details-marker { display: none; }
    .entries details.text summary::before { content: "▸"; font-style: normal; }
    .entries details.text[open] summary::before { content: "▾"; }
    .entries details.text:not([open]) summary .first { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    /* Filter chips: which sources the log shows. */
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 0.75rem; }
    .filters button { background: var(--color-background-deep); border: 2px solid var(--color-border-strong); color: var(--color-text-muted); padding: 0.5rem 0.9rem; border-radius: 999px; }
    .filters button[aria-pressed="true"] { background: var(--color-surface-raised); border-color: var(--color-accent); color: var(--color-text); }
    .filters button[aria-pressed="true"]::before { content: "✓ " / ""; color: var(--color-accent); }
    #log[data-hide~="platform"] li[data-source="platform"],
    #log[data-hide~="claude"] li[data-source="claude"],
    #log[data-hide~="thinking"] li[data-source="thinking"],
    #log[data-hide~="tool"] li[data-source="tool"] { display: none; }
    @media (max-width: 30rem) {
      .entries li { grid-template-columns: auto 1fr; justify-items: start; }
      .entries .text { grid-column: 1 / -1; }
    }

    #canvas-version { margin: 0 0 0.75rem; }
    .files { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.5rem; }
    .files > li { min-width: 0; }
    .file { border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-background-deep); overflow: hidden; min-width: 0; }
    li.file { padding: 0.7rem 0.9rem; }
    .file summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; min-height: 44px; padding: 0.6rem 0.9rem; list-style: none; }
    .file summary::-webkit-details-marker { display: none; }
    .file summary::before { content: "▸"; color: var(--color-text-muted); }
    .file[open] summary::before { content: "▾"; }
    .file[open] summary { border-bottom: 1px solid var(--color-border); }
    .file .path { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9rem; overflow-wrap: anywhere; flex: 1 1 10rem; min-width: 0; }
    .file .additions, .file .removals { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.85rem; font-weight: 700; }
    .file .additions { color: var(--color-success); }
    .file .removals { color: var(--color-danger); }
    .diff { overflow-x: auto; margin: 0; padding: 0.5rem 0; font: 0.8rem/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--color-background-deep); display: grid; grid-template-columns: minmax(100%, max-content); }
    .diff .line { display: block; white-space: pre; padding: 0 0.9rem; border-left: 3px solid transparent; }
    .diff .line.added { background: var(--color-diff-added); border-left-color: var(--color-success); }
    .diff .line.removed { background: var(--color-diff-removed); border-left-color: var(--color-danger); }
    .diff .line.hunk { color: var(--color-info); background: var(--color-surface); margin: 0.35rem 0; }
    .diff .line.meta { color: var(--color-text-muted); }
  </style>
</head>
<body>
  <main class="page">
  <nav><a href="/">← Prompts</a></nav>
  <p id="status" role="status"></p>

  <section id="missing" class="card" data-testid="missing" hidden>
    <h1>No such Run</h1>
    <p>There's no Run with this link. It may have been mistyped. <a href="/">See every Prompt</a>.</p>
  </section>

  <article id="run" data-testid="run" hidden>
    <header class="card">
      <h1 id="headline"></h1>
      <p id="original" class="original" hidden></p>
      <p id="prompt" class="prompt"></p>
      <p id="details" class="details"></p>
      <div id="actions"></div>
    </header>

    <section id="log" class="card" data-testid="log">
      <h2>Log</h2>
      <div class="filters" role="group" aria-label="Show in the log"></div>
      <div class="body"></div>
    </section>

    <section id="files" class="card" data-testid="files">
      <h2>Changed files</h2>
      <p id="canvas-version" hidden><a>View the Canvas at this version</a></p>
      <div class="body"></div>
    </section>
  </article>
  </main>

  <script type="module">
    import { actionsFor, button, changeLabel, connectLive, detailsOf, runUrl, setStatus, span } from "/console-shared.js";

    const $ = (id) => document.getElementById(id);
    // The id from the URL: a Run id, or the commit of a Landed change.
    const requested = decodeURIComponent(location.pathname.slice("/runs/".length));
    // The Run as last fetched from /api/runs/<id>, with each live summary merged in.
    let run;

    /**
     * The page's sections below the Run's details, each filling its own
     * element. `render(run)` gets the full Run view whenever it's fetched (on
     * opening and on reconnecting); `live(message)` gets every live message
     * about this Run after that.
     */
    const logSection = {
      element: $("log").querySelector(".body"),
      entries: undefined,
      // Every entry shown, so one that was both fetched and sent live appears once.
      shown: new Set(),
      render(run) {
        this.shown = new Set((run.log ?? []).map(entryKey));
        if (!run.log?.length) {
          this.entries = undefined;
          return this.element.replaceChildren(span("empty", "No log recorded"));
        }
        this.entries = document.createElement("ol");
        this.entries.className = "entries";
        this.entries.append(...run.log.map(logEntry));
        this.element.replaceChildren(this.entries);
      },
      live(message) {
        if (message.type !== "log" || this.shown.has(entryKey(message.entry))) return;
        this.shown.add(entryKey(message.entry));
        if (this.entries === undefined) this.render({ log: [message.entry] });
        else this.entries.append(logEntry(message.entry));
      },
    };

    const entryKey = ({ time, source, text }) => JSON.stringify([time, source, text]);

    /** The log's sources: the label on each entry, and on its filter chip. */
    const LOG_SOURCES = {
      platform: { entry: "Platform", chip: "Platform" },
      claude: { entry: "Claude", chip: "Claude" },
      thinking: { entry: "Thinking", chip: "Thinking" },
      tool: { entry: "Tool", chip: "Tools" },
    };

    /** One line of the log: its time, where it's from and what was said, thought or done. */
    function logEntry({ time, source, text }) {
      const item = document.createElement("li");
      item.dataset.source = source;
      const when = document.createElement("time");
      when.dateTime = time;
      when.textContent = new Date(time).toLocaleTimeString();
      when.title = new Date(time).toLocaleString();
      item.append(when, " ", span("source", LOG_SOURCES[source]?.entry ?? source), " ", source === "thinking" ? thinkingText(text) : span("text", text));
      return item;
    }

    /** A thinking summary: shown whole if it's one short line, otherwise its first line, expanding on a tap. */
    function thinkingText(text) {
      const [first, ...rest] = text.split("\n");
      if (rest.length === 0 && first.length <= 100) return span("text", text);
      const details = document.createElement("details");
      details.className = "text";
      const summary = document.createElement("summary");
      summary.append(span("first", first));
      details.append(summary, rest.length ? span("more", "\n" + rest.join("\n")) : "");
      return details;
    }

    /**
     * The log's filter chips, one per source, all on unless this device
     * turned some off. Hidden sources are set on the section, so CSS hides
     * entries added live too.
     */
    const logFilters = {
      key: "runLogHidden",
      hidden() {
        try {
          const saved = JSON.parse(localStorage.getItem(this.key) ?? "[]");
          return new Set(Array.isArray(saved) ? saved : []);
        } catch {
          return new Set();
        }
      },
      show(hidden) {
        $("log").dataset.hide = [...hidden].join(" ");
        for (const chip of $("log").querySelectorAll(".filters button")) chip.setAttribute("aria-pressed", String(!hidden.has(chip.dataset.source)));
      },
      start() {
        const chips = Object.entries(LOG_SOURCES).map(([source, { chip: label }]) => {
          const chip = button(label, () => {
            const hidden = this.hidden();
            if (hidden.has(source)) hidden.delete(source);
            else hidden.add(source);
            try {
              localStorage.setItem(this.key, JSON.stringify([...hidden]));
            } catch {}
            this.show(hidden);
          });
          chip.dataset.source = source;
          return chip;
        });
        $("log").querySelector(".filters").replaceChildren(...chips);
        this.show(this.hidden());
      },
    };
    logFilters.start();

    /**
     * The files the Run changed: names while it's in progress, updated live;
     * once finished, each with its added and removed line counts, expanding
     * to its diff. A Landed Run also links to the Canvas at its commit.
     */
    const filesSection = {
      element: $("files").querySelector(".body"),
      render(run) {
        this.element.replaceChildren(changedFilesList(run.files ?? [], { finished: run.finished }));
        void showCanvasVersion(run.state === "landed" ? run.commit : undefined);
      },
      live(message) {
        if (message.type === "files") this.element.replaceChildren(changedFilesList(message.files.map((path) => ({ path })), { finished: false }));
        // Finished: fetch the final change, which only the Run's endpoint serves.
        if (message.type === "run" && message.run.finished) void refreshFiles();
      },
    };

    async function refreshFiles() {
      const response = await fetch(`/api/runs/${encodeURIComponent(run.id)}`);
      if (response.ok) filesSection.render(await response.json());
    }

    /**
     * A list of changed files. Files with a diff (any saved diff, split per
     * file by the Console API) show their counts and expand to it.
     */
    function changedFilesList(files, { finished }) {
      if (files.length === 0) return span("empty", finished ? "No changes" : "No files edited yet");
      const list = document.createElement("ul");
      list.className = "files";
      list.append(...files.map((file) => {
        if (file.diff === undefined) {
          const item = document.createElement("li");
          item.className = "file";
          item.append(span("path", file.path));
          return item;
        }
        const item = document.createElement("li");
        const details = document.createElement("details");
        details.className = "file";
        const summary = document.createElement("summary");
        summary.append(span("path", file.path), " ", span("additions", `+${file.added}`), " ", span("removals", `−${file.removed}`));
        const diff = document.createElement("pre");
        diff.className = "diff";
        diff.append(...file.diff.split("\n").map(diffLine));
        details.append(summary, diff);
        item.append(details);
        return item;
      }));
      return list;
    }

    function diffLine(text) {
      const kind = text.startsWith("@@") ? "hunk"
        : /^(diff |index |--- |\+\+\+ |new file|deleted file|old mode|new mode|similarity|rename |Binary )/.test(text) ? "meta"
        : text.startsWith("+") ? "added"
        : text.startsWith("-") ? "removed"
        : "context";
      return span(`line ${kind}`, text);
    }

    let canvas;
    /** Shows the link to the Canvas's commit-pinned URL for `commit`, or hides it if there's none. */
    async function showCanvasVersion(commit) {
      const paragraph = $("canvas-version");
      if (commit === undefined) return void (paragraph.hidden = true);
      canvas ??= await fetch("/api/canvas").then((response) => (response.ok ? response.json() : undefined));
      if (canvas === undefined) return;
      paragraph.querySelector("a").href = `${location.protocol}//${location.hostname}:${canvas.port}${canvas.versionPath.replace("{commit}", commit)}`;
      paragraph.hidden = false;
    }

    const sections = [logSection, filesSection];

    const status = (message, isError) => setStatus($("status"), message, isError);

    // Live messages that arrive while the Run is being fetched; handled once it has been, so none is missed.
    let pending;

    async function load() {
      pending = [];
      try {
        const response = await fetch(`/api/runs/${encodeURIComponent(requested)}`);
        if (response.status === 404) {
          document.title = "No such Run";
          $("missing").hidden = false;
          $("run").hidden = true;
          return;
        }
        if (!response.ok) return status("Couldn't load this Run; retrying…", true);
        run = await response.json();
        renderDetails();
        for (const section of sections) section.render(run);
        $("run").hidden = false;
      } finally {
        const missed = pending;
        pending = undefined;
        for (const message of missed) handleLive(message);
      }
    }

    /** The same details as the Run's Prompts list entry, with the whole Prompt, plus Replay once Landed. */
    function renderDetails() {
      document.title = `${run.nickname}: ${run.prompt}`;
      $("run").dataset.state = run.state;
      $("run").dataset.run = run.id;
      $("headline").replaceChildren(span(`state ${run.state}`, run.state), " ", span("nickname", run.nickname));
      $("original").hidden = !run.original;
      if (run.original) {
        const link = document.createElement("a");
        link.href = runUrl(run.original.commit);
        const { mark, name } = changeLabel(run);
        link.append(`${name} of `, span("nickname original-nickname", run.original.nickname), `'s '${run.prompt}'`);
        $("original").replaceChildren(mark, link);
      }
      $("prompt").textContent = run.prompt;
      $("details").replaceChildren(...detailsOf(run));
      $("actions").replaceChildren(...(run.state === "landed" && run.commit ? [actionsFor(run, { defaultModel: () => run.model, onQueued })] : []));
    }

    function onQueued({ ok, what, run: queued, error, started }) {
      if (!ok) return status(error, true);
      const link = document.createElement("a");
      link.href = runUrl(queued.id);
      link.textContent = `Follow your ${what}`;
      status([queued.state === "waiting" ? `Your ${what} is in the queue… ` : `${started} `, link]);
    }

    function handleLive(message) {
      // Reconnected: fetch the whole Run again, in case something was missed.
      if (message.type === "snapshot") return void load();
      if (pending) return void pending.push(message);
      if (run === undefined) return;
      if (message.type === "run" && message.run.id === run.id) {
        Object.assign(run, message.run);
        renderDetails();
      }
      if ((message.run?.id ?? message.runId) === run.id) for (const section of sections) section.live(message);
    }

    connectLive(handleLive);
  </script>
</body>
</html>
